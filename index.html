<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>登鹳雀楼</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Noto+Serif+SC:wght@400;500&display=swap">
<style>
/* Layout: one hanging scroll-style painting, a caption and seal-style button beneath it. Single committed ink-on-paper look; colour is added in four stages as the verses appear. */
:root {
  --paper: #f0f0ee;
  --ground: #dcdcd9;
  --ink: #1c1c1c;
  --ink-soft: #4a4a48;
  --seal: #2e2e2e;
  --font-brush: 'Ma Shan Zheng', 'KaiTi', 'STKaiti', 'Kaiti SC', serif;
  --font-body: 'Noto Serif SC', 'Songti SC', 'SimSun', serif;
  color-scheme: light;
}
body {
  background: var(--ground);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 15px;
  line-height: 1.7;
}
.page {
  max-width: 760px;
  margin: 0 auto;
  padding-inline: 16px;
  padding-block: 24px 40px;
  display: flex;
  flex-direction: column;
  gap: 20px;
}
#scene { display: block; width: 100%; height: auto; max-width: 100%; }
.controls {
  display: flex;
  flex-wrap: wrap;
  align-items: flex-start;
  justify-content: space-between;
  gap: 20px 24px;
}
.caption { flex: 1 1 240px; min-width: 0; }
.caption .title { font-family: var(--font-brush); font-size: 30px; font-weight: 400; line-height: 1.3; margin: 0 0 6px; }
.lines { display: flex; flex-direction: column; gap: 2px; margin: 0; padding: 0; list-style: none; }
.line {
  display: inline-flex;
  align-items: center;
  gap: 12px;
  align-self: flex-start;
  padding: 2px 0;
  background: none;
  border: 0;
  font-family: var(--font-brush);
  font-size: 30px;
  line-height: 1.35;
  letter-spacing: 0.08em;
  color: var(--ink-soft);
  cursor: pointer;
  text-align: left;
  transition: color 0.6s ease;
}
.line::before {
  content: '';
  width: 12px;
  height: 12px;
  flex: 0 0 auto;
  border: 1.5px solid var(--ink);
  background: transparent;
  transition: background-color 0.6s ease;
}
.line.done { color: var(--ink); }
.line.done::before { background: var(--ink); }
.line:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }
.caption .gloss { margin: 8px 0 0; color: var(--ink-soft); font-size: 15px; min-height: 1.7em; }
.voice { display: flex; flex-direction: column; align-items: flex-start; gap: 10px; flex: 0 0 auto; max-width: 100%; }
.mic {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  font-family: var(--font-brush);
  font-size: 26px;
  letter-spacing: 0.15em;
  padding: 12px 26px 12px 22px;
  background: var(--seal);
  color: var(--paper);
  border: 0;
  border-radius: 2px;
  cursor: pointer;
}
.mic svg { width: 26px; height: 26px; flex: 0 0 auto; }
.mic:hover { background: #000; }
.mic:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }
.mic.on { background: #b3342a; animation: pulse 1.6s ease-out infinite; }
@keyframes pulse {
  0% { box-shadow: 0 0 0 0 rgba(179, 52, 42, 0.45); }
  100% { box-shadow: 0 0 0 16px rgba(179, 52, 42, 0); }
}
.status { margin: 0; max-width: 17em; min-height: 1.7em; font-size: 14px; color: var(--ink-soft); }
.heard { margin: 0; max-width: 17em; min-height: 1.4em; font-size: 13px; color: var(--ink-soft); opacity: 0.8; }
.note { margin: 0; font-size: 13px; color: var(--ink-soft); }
.chars { display: flex; flex-wrap: wrap; align-items: flex-start; gap: 8px 16px; }
.char-lines { display: flex; flex-direction: column; gap: 8px; }
.char-line { display: flex; gap: 8px; }
.chars-label { font-size: 13px; color: var(--ink-soft); padding-top: 14px; }
.char {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 46px;
  height: 46px;
  font-family: var(--font-brush);
  font-size: 30px;
  line-height: 1;
  color: var(--ink);
  text-decoration: none;
  border: 1px solid var(--ink);
  border-radius: 2px;
}
.char:hover { background: var(--ink); color: var(--paper); }
.char:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }

.stagelayer { opacity: 0; transition: opacity 2.2s ease; }
.s1 #c1, .s2 #c2, .s3 #c3, .s4 #c4 { opacity: 1; }
#scene { border-radius: 4px; }
#halo { opacity: 0; transition: opacity 1.6s ease; pointer-events: none; }
.s1 #halo { opacity: 1; animation: breathe 3.6s ease-in-out infinite; transform-origin: 500px 300px; }
@keyframes breathe { 0%, 100% { transform: scale(0.92); opacity: 0.55; } 50% { transform: scale(1.12); opacity: 1; } }
#glit { opacity: 0; transition: opacity 1.6s ease; pointer-events: none; }
.s2 #glit { opacity: 1; }
#glit ellipse { fill: #fffbe6; opacity: 0; animation: twinkle 2.6s ease-in-out infinite; }
@keyframes twinkle { 0%, 100% { opacity: 0; transform: translateX(0); } 50% { opacity: 0.85; transform: translateX(14px); } }
#flyers { opacity: 0; transition: opacity 1.6s ease; pointer-events: none; }
.s3 #flyers { opacity: 1; }
.fly { animation: fly 30s linear infinite; }
.fly .wing { fill: none; stroke: #4d4640; stroke-width: 3.5; stroke-linecap: round; stroke-linejoin: round; transform-box: fill-box; transform-origin: 50% 100%; animation: flap 0.9s ease-in-out infinite; }
@keyframes fly { from { transform: translateX(-120px); } to { transform: translateX(1800px); } }
@keyframes flap { 0%, 100% { transform: scaleY(1); } 50% { transform: scaleY(0.35); } }
#girl, #boy { cursor: pointer; transform-box: fill-box; transform-origin: 50% 85%; }
#girl:focus-visible, #boy:focus-visible { outline: 3px solid #fff; }
@media (prefers-reduced-motion: reduce) {
  .mic.on { animation: none; }
  .stagelayer, .line, .line::before, #halo, #glit, #flyers { transition: none; }
  .s1 #halo, #glit ellipse, .fly, .fly .wing { animation: none; }
  #glit ellipse { opacity: 0.5; }
}
</style>

y:0.07s;animation-duration:2.83s"/><ellipse cx="486" cy="525" rx="29" ry="2.6" style="animation-delay:1.38s;animation-duration:3.13s"/><ellipse cx="460" cy="660" rx="34" ry="2.6" style="animation-delay:2.22s;animation-duration:3.17s"/><ellipse cx="666" cy="523" rx="24" ry="2.6" style="animation-delay:0.92s;animation-duration:2.23s"/><ellipse cx="861" cy="593" rx="33" ry="2.6" style="animation-delay:2.57s;animation-duration:3.35s"/><ellipse cx="457" cy="621" rx="32" ry="2.6" style="animation-delay:2.19s;animation-duration:2.78s"/><ellipse cx="720" cy="477" rx="27" ry="2.6" style="animation-delay:2.37s;animation-duration:3.14s"/><ellipse cx="299" cy="706" rx="33" ry="2.6" style="animation-delay:1.03s;animation-duration:2.68s"/><ellipse cx="652" cy="504" rx="17" ry="2.6" style="animation-delay:0.39s;animation-duration:3.29s"/><ellipse cx="132" cy="714" rx="34" ry="2.6" style="animation-delay:1.71s;animation-duration:2.62s"/><ellipse cx="585" cy="619" rx="33" ry="2.6" style="animation-delay:1.13s;animation-duration:3.25s"/><ellipse cx="463" cy="613" rx="19" ry="2.6" style="animation-delay:1.09s;animation-duration:2.36s"/><ellipse cx="814" cy="585" rx="32" ry="2.6" style="animation-delay:1.3s;animation-duration:2.84s"/><ellipse cx="421" cy="658" rx="17" ry="2.6" style="animation-delay:1.23s;animation-duration:3.07s"/><ellipse cx="706" cy="484" rx="25" ry="2.6" style="animation-delay:0.65s;animation-duration:2.53s"/></g>

<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var scene = $('scene'), girl = $('girl'), boy = $('boy'), gsm = $('gsm');
  var micBtn = $('mic'), micLabel = $('micLabel'), statusEl = $('status'), heardEl = $('heard'), glossEl = $('gloss');
  var lineBtns = Array.prototype.slice.call(document.querySelectorAll('.line'));
  var SR = window.SpeechRecognition || window.webkitSpeechRecognition;

  var LINES = ['白日依山尽', '黄河入海流', '欲穷千里目', '更上一层楼'];
  var GLOSS = [
    '太阳靠着西边的山，慢慢沉下去。',
    '黄河奔腾向东，流向远方的大海。',
    '想把千里之外的景色都看个够。',
    '咕嘎和小朋友一起跳一跳，再登上一层楼！'
  ];
  var FINAL = '站得高，才看得远。';
  var NEED = 3;
  var done = [false, false, false, false];
  var listening = false, want = false, fatal = false, rec = null, restartTimer = 0, revealTimers = [];

  /* Characters that sound alike are treated as the same, because speech recognition often
     writes a different character for a child's voice. The first character of each group is the one kept. */
  var GROUPS = ['白百柏摆拜', '日', '依一衣医伊', '山闪善扇杉', '尽进近紧金今劲仅', '黄皇煌凰',
    '河和合何', '入如', '海还害', '流留刘', '欲预遇育玉', '穷琼', '千前钱牵', '里理李力',
    '目木母幕慕', '更耕跟根', '上尚商', '层曾', '楼漏搂'];
  var CANON = {};
  GROUPS.forEach(function (g) { for (var i = 0; i < g.length; i++) CANON[g.charAt(i)] = g.charAt(0); });

  function canon(text) {
    var out = [], i, c;
    for (i = 0; i < text.length; i++) {
      c = text.charAt(i);
      if (c >= '一' && c <= '鿿') out.push(CANON[c] || c);
    }
    return out;
  }
  function lcs(a, b) {
    var prev = [], cur, i, j;
    for (j = 0; j <= b.length; j++) prev.push(0);
    for (i = 1; i <= a.length; i++) {
      cur = [0];
      for (j = 1; j <= b.length; j++) {
        cur.push(a[i - 1] === b[j - 1] ? prev[j - 1] + 1 : Math.max(prev[j], cur[j - 1]));
      }
      prev = cur;
    }
    return prev[b.length];
  }
  var LINE_CANON = LINES.map(canon);

  function findLines(texts) {
    var found = [], i, t, k, tail;
    for (i = 0; i < 4; i++) {
      if (done[i]) continue;
      for (k = 0; k < texts.length; k++) {
        tail = canon(texts[k]).slice(-60);
        if (lcs(LINE_CANON[i], tail) >= NEED) { found.push(i); break; }
      }
    }
    return found;
  }

  function allDone() { return done.every(function (d) { return d; }); }

  function setStatus(text) { statusEl.textContent = text; }

  function setListening(on) {
    listening = on;
    micBtn.classList.toggle('on', on);
    micBtn.setAttribute('aria-pressed', on ? 'true' : 'false');
    micLabel.textContent = on ? '我在听' : (allDone() ? '再读一遍' : '开始读');
    if (!on) heardEl.textContent = '';
  }

  var satTimer = 0, hopAnims = [], hopTimer = 0;
  var reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  function setSat(v) { gsm.setAttribute('values', String(v)); }
  function tweenSat(from, to, ms) {
    cancelAnimationFrame(satTimer);
    if (reduce || ms <= 0) { setSat(to); return; }
    var t0 = performance.now();
    (function step(now) {
      var k = Math.min(1, (now - t0) / ms);
      setSat(from + (to - from) * k);
      if (k < 1) satTimer = requestAnimationFrame(step);
    })(t0);
  }

  function hopOne(el, times, delay) {
    if (!el.animate || reduce) return null;
    return el.animate([
      { transform: 'translateY(0px) scale(1,1)' },
      { transform: 'translateY(0px) scale(1.05,0.93)', offset: 0.18 },
      { transform: 'translateY(-40px) scale(0.97,1.05)', offset: 0.5 },
      { transform: 'translateY(0px) scale(1.05,0.93)', offset: 0.82 },
      { transform: 'translateY(0px) scale(1,1)' }
    ], { duration: 720, iterations: times, delay: delay || 0, easing: 'ease-in-out' });
  }
  function hopBoth(times) {
    hopAnims.forEach(function (a) { if (a) a.cancel(); });
    hopAnims = [hopOne(girl, times, 0), hopOne(boy, times, 140)];
  }

  function reveal(i) {
    if (done[i]) return;
    done[i] = true;
    lineBtns[i].classList.add('done');
    glossEl.textContent = GLOSS[i];
    scene.classList.add('s' + (i + 1));
    if (i === 3) {
      tweenSat(0, 1, 2200);
      clearTimeout(hopTimer);
      hopTimer = setTimeout(function () { hopBoth(3); }, 1500);
    }
    if (allDone()) {
      glossEl.textContent = FINAL;
      stopListening();
      setStatus('');
    }
  }

  function resetAll() {
    revealTimers.forEach(function (t) { clearTimeout(t); });
    revealTimers = [];
    clearTimeout(hopTimer);
    hopAnims.forEach(function (a) { if (a) a.cancel(); }); hopAnims = [];
    cancelAnimationFrame(satTimer);
    setSat(0);
    scene.setAttribute('class', '');
    done = [false, false, false, false];
    lineBtns.forEach(function (b) { b.classList.remove('done'); });
    glossEl.textContent = '';
    heardEl.textContent = '';
  }

  [girl, boy].forEach(function (el) {
    el.addEventListener('click', function () { hopAnims.push(hopOne(el, 1, 0)); });
    el.addEventListener('keydown', function (e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); hopAnims.push(hopOne(el, 1, 0)); } });
  });

  /* ----- listening ----- */
  function handleResult(e) {
    var results = Array.prototype.slice.call(e.results), texts = [], i, j, primary, first = e.resultIndex || 0;
    primary = results.map(function (r) { return r[0] ? r[0].transcript : ''; }).join('');
    texts.push(primary);
    for (i = first; i < results.length; i++) {
      for (j = 1; j < results[i].length; j++) texts.push(results[i][j].transcript);
    }
    var shown = primary.replace(/[^一-鿿]/g, '').slice(-12);
    heardEl.textContent = shown ? '听到：' + shown : '';
    var found = findLines(texts);
    found.forEach(function (idx, k) {
      var t = setTimeout(function () { reveal(idx); }, k * 900);
      revealTimers.push(t);
    });
  }

  function handleError(e) {
    var code = e && e.error;
    if (code === 'not-allowed' || code === 'service-not-allowed') {
      fatal = true;
      setStatus('需要允许使用麦克风。允许后，再点一次“开始读”。也可以直接点一句诗。');
    } else if (code === 'audio-capture') {
      fatal = true;
      setStatus('没有找到麦克风。也可以直接点一句诗。');
    } else if (code === 'network') {
      fatal = true;
      setStatus('没有连上网。听声音需要联网。也可以直接点一句诗。');
    } else if (code === 'language-not-supported') {
      fatal = true;
      setStatus('这个浏览器听不懂中文。也可以直接点一句诗。');
    }
  }

  function startRecognition() {
    if (!want || fatal) return;
    try {
      rec = new SR();
      rec.lang = 'zh-CN';
      rec.continuous = true;
      rec.interimResults = true;
      rec.maxAlternatives = 3;
      rec.onresult = handleResult;
      rec.onerror = handleError;
      rec.onend = function () {
        if (want && !fatal) {
          clearTimeout(restartTimer);
          restartTimer = setTimeout(startRecognition, 250);
        } else {
          setListening(false);
        }
      };
      rec.start();
    } catch (err) {
      clearTimeout(restartTimer);
      if (want && !fatal) restartTimer = setTimeout(startRecognition, 400);
    }
  }

  function startListening() {
    if (!SR) {
      setStatus('这里听不到声音。请用 Chrome 或 Safari 打开，或者直接点一句诗。');
      return;
    }
    fatal = false;
    want = true;
    setStatus('');
    setListening(true);
    startRecognition();
  }

  function stopListening() {
    want = false;
    clearTimeout(restartTimer);
    if (rec) { try { rec.onend = null; rec.stop(); } catch (err) {} }
    rec = null;
    setListening(false);
  }

  micBtn.addEventListener('click', function () {
    if (listening) { stopListening(); setStatus(''); return; }
    if (allDone()) resetAll();
    startListening();
  });

  lineBtns.forEach(function (b, i) {
    b.addEventListener('click', function () { reveal(i); });
  });

  /* For testing: feed a sentence as if it had been heard. */
  window.heardText = function (text) { handleResult({ resultIndex: 0, results: [[{ transcript: text }]] }); };
})();
</script>

</body></html>
