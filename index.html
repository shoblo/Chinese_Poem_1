<style>
/* Layout: one hanging scroll-style painting, a caption and seal-style button beneath it. Single committed ink-on-paper look; colour is added in four stages as the verses appear. */
:root {
  --paper: #f0f0ee;
  --ground: #dcdcd9;
  --ink: #1c1c1c;
  --ink-soft: #4a4a48;
  --seal: #2e2e2e;
  --font-brush: 'Ma Shan Zheng', 'KaiTi', 'STKaiti', 'Kaiti SC', serif;
  --font-body: 'Noto Serif SC', 'Songti SC', 'SimSun', serif;
  color-scheme: light;
}
body {
  background: var(--ground);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 15px;
  line-height: 1.7;
}
.page {
  max-width: 760px;
  margin: 0 auto;
  padding-inline: 16px;
  padding-block: 24px 40px;
  display: flex;
  flex-direction: column;
  gap: 20px;
}
#scene { display: block; width: 100%; height: auto; max-width: 100%; }
.controls {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: 16px 24px;
}
.caption { flex: 1 1 240px; min-width: 0; }
.caption .verse { font-family: var(--font-brush); font-size: 30px; line-height: 1.3; margin: 0; }
.caption .gloss { margin: 4px 0 0; color: var(--ink-soft); font-size: 15px; min-height: 1.7em; }
.start {
  font-family: var(--font-brush);
  font-size: 24px;
  letter-spacing: 0.25em;
  padding: 10px 26px 10px calc(26px + 0.25em);
  background: var(--seal);
  color: var(--paper);
  border: 0;
  border-radius: 2px;
  cursor: pointer;
  flex: 0 0 auto;
}
.start:hover:not(:disabled) { background: #000; }
.start:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }
.start:disabled { opacity: 0.55; cursor: default; }
.note { margin: 0; font-size: 13px; color: var(--ink-soft); }
.chars { display: flex; flex-wrap: wrap; align-items: flex-start; gap: 8px 16px; }
.char-lines { display: flex; flex-direction: column; gap: 8px; }
.char-line { display: flex; gap: 8px; }
.chars-label { font-size: 13px; color: var(--ink-soft); padding-top: 14px; }
.char {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 46px;
  height: 46px;
  font-family: var(--font-brush);
  font-size: 30px;
  line-height: 1;
  color: var(--ink);
  text-decoration: none;
  border: 1px solid var(--ink);
  border-radius: 2px;
}
.char:hover { background: var(--ink); color: var(--paper); }
.char:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }

.poem { font-family: var(--font-brush); fill: #1c1c1c; text-anchor: middle; }
.poem text { transition: opacity 0.9s ease; }
[data-s] { transition: fill 2s ease, stroke 2s ease; }
#sun { transition: transform 4.2s ease-out; }
#figure { transition: transform 3.4s ease-in-out; }
.flow { opacity: 0; transition: opacity 1.2s ease, stroke 2s ease; }
.flowing .flow { opacity: 0.9; animation: flow 1.6s linear infinite; }
.flowing .flow.slow { animation-duration: 2.4s; }
@keyframes flow { to { stroke-dashoffset: 30; } }
.running #birds { animation: drift 9s ease-in-out infinite alternate; }
.running #cloudsA { animation: cloud 18s ease-in-out infinite alternate; }
.running #cloudsB { animation: cloud 24s ease-in-out infinite alternate-reverse; }
@keyframes drift { from { transform: translate(0, 0); } to { transform: translate(150px, -14px); } }
@keyframes cloud { from { transform: translateX(0); } to { transform: translateX(36px); } }
@media (prefers-reduced-motion: reduce) {
  #sun, #figure, .poem text, .flow, [data-s] { transition: none; }
  .running #birds, .running #cloudsA, .running #cloudsB, .flowing .flow { animation: none; }
}
</style>

<style>body{margin:0}[hidden]{display:none!important}</style>

<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var scene = $('scene'), sun = $('sun'), figure = $('figure');
  var btn = $('start'), verseEl = $('verse'), glossEl = $('gloss');
  var tinted = scene.querySelectorAll('[data-s]');
  var verses = [
    { line: '白日依山尽', gloss: '太阳靠着西边的山，慢慢沉下去。' },
    { line: '黄河入海流', gloss: '黄河奔腾向东，流向远方的大海。' },
    { line: '欲穷千里目', gloss: '想把千里之外的景色都看个够。' },
    { line: '更上一层楼', gloss: '那就再登上一层楼。' }
  ];
  var running = false;

  function colorize(n) {
    var els = scene.querySelectorAll('[data-s="' + n + '"]');
    for (var i = 0; i < els.length; i++) {
      var el = els[i];
      if (el.getAttribute('data-fill')) el.style.fill = el.getAttribute('data-fill');
      if (el.getAttribute('data-stroke')) el.style.stroke = el.getAttribute('data-stroke');
    }
  }

  function light(n) {
    $('v' + n).style.opacity = 1;
    verseEl.textContent = verses[n - 1].line;
    glossEl.textContent = verses[n - 1].gloss;
    colorize(n);
  }

  function reset() {
    var i;
    sun.style.transition = 'none';
    figure.style.transition = 'none';
    for (i = 0; i < tinted.length; i++) {
      tinted[i].style.transition = 'none';
      tinted[i].style.fill = '';
      tinted[i].style.stroke = '';
    }
    sun.style.transform = 'translateY(-50px)';
    figure.style.transform = 'translateY(102px)';
    for (i = 1; i <= 4; i++) $('v' + i).style.opacity = 0.15;
    scene.classList.remove('flowing');
    void scene.getBoundingClientRect();
    sun.style.transition = '';
    figure.style.transition = '';
    for (i = 0; i < tinted.length; i++) tinted[i].style.transition = '';
  }

  function play() {
    if (running) return;
    running = true;
    btn.disabled = true;
    btn.textContent = '进行中';
    verseEl.textContent = '登鹳雀楼';
    glossEl.textContent = '';
    reset();
    scene.classList.add('running');

    setTimeout(function () {
      light(1);
      sun.style.transform = 'translateY(0px)';
    }, 400);
    setTimeout(function () {
      light(2);
      scene.classList.add('flowing');
    }, 6800);
    setTimeout(function () {
      light(3);
      figure.style.transform = 'translateY(40px)';
    }, 13200);
    setTimeout(function () {
      light(4);
      figure.style.transform = 'translateY(0px)';
    }, 19600);
    setTimeout(function () {
      glossEl.textContent = '站得高，才看得远。';
      running = false;
      btn.disabled = false;
      btn.textContent = '重看';
    }, 24000);
  }

  btn.addEventListener('click', play);
})();
</script>
