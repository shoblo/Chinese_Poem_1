<style>
/* Layout: one narrow column. A picture card, the character drawn stroke by stroke on a loop (tap to see the English word), then a short entry for children. Same ink-on-paper look as the painting page. */
:root {
  --ground: #dcdcd9; --paper: #f0f0ee; --square: #ffffff; --edge: #bdbdb9;
  --ink: #1c1c1c; --ink-soft: #4a4a48; --rule: #c4c4c0; --ghost: #c2c2be;
  --font-brush: 'Ma Shan Zheng', 'KaiTi', 'STKaiti', 'Kaiti SC', serif;
  --font-body: 'Noto Serif SC', 'Songti SC', 'SimSun', serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
[hidden] { display: none !important; }
body { background: var(--ground); color: var(--ink); font-family: var(--font-body); font-size: 16px; line-height: 1.75; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
.page { max-width: 560px; margin: 0 auto; padding-inline: 16px; padding-block: 20px 48px; display: flex; flex-direction: column; gap: 28px; }
.top { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 6px 16px; }
.back { color: var(--ink-soft); font-size: 14px; text-decoration: none; border-bottom: 1px solid var(--rule); }
.back:hover { color: var(--ink); border-bottom-color: var(--ink); }
.context { margin: 0; font-family: var(--font-brush); font-size: 22px; line-height: 1.4; letter-spacing: 0.15em; color: var(--ink-soft); }
.context b { font-weight: 400; color: var(--ink); border-bottom: 3px solid var(--ink); }
.back:focus-visible, .glyph:focus-visible, .pager a:focus-visible { outline: 3px solid var(--ink); outline-offset: 4px; }
.stage { display: flex; flex-direction: column; align-items: center; gap: 12px; }
.demo { display: flex; align-items: flex-start; justify-content: center; gap: 14px; margin-bottom: 8px; max-width: 100%; }
.square { width: min(62vw, 260px); aspect-ratio: 1; flex: 0 1 auto; max-width: 100%; background: var(--square); border: 1px solid var(--edge); transition: background-color 0.45s ease; }
.swatches { display: flex; flex-direction: column; gap: 6px; flex: 0 0 auto; }
.sw { width: 40px; height: 40px; padding: 0; border-radius: 50%; border: 2px solid var(--ink); background: var(--c); cursor: pointer; }
.sw[aria-pressed="true"] { outline: 3px solid var(--ink); outline-offset: 3px; }
.sw:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }
.pinyin { margin: 0; font-size: 20px; line-height: 1.4; color: var(--ink-soft); min-height: 1.4em; text-align: center; }
.square svg { display: block; width: 100%; height: 100%; }
.glyph { width: 220px; max-width: 100%; height: 190px; padding: 0; background: transparent; color: var(--ink); border: 0; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; }
.glyph svg { width: 180px; height: 180px; display: block; }
.live path { stroke-dasharray: 1 2; }
.en-text { font-family: var(--font-body); font-size: 60px; font-weight: 500; letter-spacing: 0.04em; line-height: 1.15; text-align: center; padding: 0 8px; }
.en-text.mid { font-size: 42px; }
.en-text.long { font-size: 32px; }
.stroke-label { margin: 0; min-height: 1.75em; font-family: var(--font-brush); font-size: 24px; line-height: 1.5; text-align: center; }
.hint { margin: 0; font-size: 14px; color: var(--ink-soft); min-height: 1.75em; text-align: center; }
.entry { display: flex; flex-direction: column; gap: 18px; border-top: 1px solid var(--rule); padding-top: 24px; }
.entry h1 { margin: 0; font-family: var(--font-brush); font-weight: 400; font-size: 32px; line-height: 1.2; }
.facts { display: grid; grid-template-columns: auto 1fr; gap: 6px 18px; margin: 0; }
.facts dt { color: var(--ink-soft); font-size: 16px; }
.facts dd { margin: 0; min-width: 0; font-size: 19px; }
.entry h2 { margin: 0; font-family: var(--font-brush); font-weight: 400; font-size: 26px; line-height: 1.3; }
.entry p { margin: 0; max-width: 30em; font-size: 19px; line-height: 1.9; }
.words { display: flex; flex-wrap: wrap; gap: 10px 12px; margin: 0; padding: 0; list-style: none; }
.words li { display: inline-flex; align-items: center; gap: 10px; font-family: var(--font-brush); font-size: 26px; line-height: 1.3; padding: 6px 18px 6px 10px; background: var(--square); border: 1px solid var(--ink); border-radius: 2px; }
.words svg { width: 40px; height: 40px; flex: 0 0 auto; }
.pager { display: flex; justify-content: space-between; gap: 12px; border-top: 1px solid var(--rule); padding-top: 20px; }
.pager a { display: inline-flex; align-items: center; gap: 8px; min-height: 48px; padding: 6px 18px; color: var(--ink); text-decoration: none; border: 1px solid var(--ink); border-radius: 2px; font-family: var(--font-brush); font-size: 26px; line-height: 1.2; }
.pager a small { font-family: var(--font-body); font-size: 13px; color: var(--ink-soft); }
.pager a:hover { background: var(--ink); color: var(--paper); }
.pager a:hover small { color: var(--paper); }
</style>
</head>

<script>
(function () {
  var V = [{"key":"main","char":"上","pinyin":"shàng","english":"up","color":"#1c1c1c","bg":null,"names":["竖","横","横"]}];
  var START_INDEX = 0;
  var glyph = document.getElementById('glyph');
  var enText = document.getElementById('en');
  var label = document.getElementById('label');
  var hint = document.getElementById('hint');
  var pinyinEl = document.getElementById('pinyin');
  var square = document.getElementById('square');
  var back = document.getElementById('back');
  var swatches = Array.prototype.slice.call(document.querySelectorAll('.sw'));
  var svgs = V.map(function (v) { return document.getElementById('g-' + v.key); });
  var lives = V.map(function (v) { return document.getElementById('live-' + v.key); });
  var strokesOf = lives.map(function (l) { return Array.prototype.slice.call(l.querySelectorAll('path')); });
  var numerals = ['一','二','三','四','五','六','七','八','九','十','十一','十二','十三','十四','十五'];
  var reduce = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
  var DEFAULT_HINT = "";
  var cur = START_INDEX, english = false, t0 = 0, raf = 0, lastLabel = '';
  var count = 0, START = 400, DUR = 900, STEP = 1200, HOLD = 1500, FADE = 600, FADE_AT = 0, CYCLE = 0;
  function timing() {
    count = strokesOf[cur].length;
    DUR = count <= 6 ? 900 : 750;
    STEP = count <= 6 ? 1200 : 1000;
    FADE_AT = START + (count - 1) * STEP + DUR + HOLD;
    CYCLE = FADE_AT + FADE;
  }
  function show(el, on) { if (on) el.removeAttribute('hidden'); else el.setAttribute('hidden', ''); }
  function setLabel(text) { if (text !== lastLabel) { label.textContent = text; lastLabel = text; } }
  function ease(p) { return p * p * (3 - 2 * p); }
  function draw(t) {
    var v = V[cur], strokes = strokesOf[cur], i, p, started = -1, done = 0;
    for (i = 0; i < count; i++) {
      p = (t - (START + i * STEP)) / DUR;
      p = p < 0 ? 0 : (p > 1 ? 1 : p);
      if (p > 0) started = i;
      if (p >= 1) done++;
      strokes[i].style.strokeDashoffset = String(1 - ease(p));
      strokes[i].style.opacity = p > 0 ? '1' : '0';
    }
    lives[cur].style.opacity = t > FADE_AT ? String(Math.max(0, 1 - (t - FADE_AT) / FADE)) : '1';
    if (started < 0) setLabel('看一看，' + v.char + '是怎么写的');
    else if (done === count) setLabel('写好啦，一共 ' + count + ' 笔');
    else setLabel('第' + numerals[started] + '笔' + (v.names[started] ? '：' + v.names[started] : ''));
  }
  function drawAll() {
    var v = V[cur], strokes = strokesOf[cur], i;
    for (i = 0; i < count; i++) { strokes[i].style.strokeDashoffset = '0'; strokes[i].style.opacity = '1'; }
    lives[cur].style.opacity = '1';
    setLabel(v.names.every(function (x) { return x; }) ? '笔顺：' + v.names.join('、') : '一共 ' + count + ' 笔');
  }
  function tick(now) { draw((now - t0) % CYCLE); raf = window.requestAnimationFrame(tick); }
  function stop() { if (raf) { window.cancelAnimationFrame(raf); raf = 0; } }
  function start() {
    stop();
    lastLabel = null;
    timing();
    if (reduce) { drawAll(); return; }
    t0 = performance.now();
    raf = window.requestAnimationFrame(tick);
  }
  function select(i) {
    var v = V[i];
    cur = i; english = false;
    svgs.forEach(function (el, k) { show(el, k === i); });
    show(enText, false);
    if (square && v.bg) square.style.backgroundColor = v.bg;
    swatches.forEach(function (b, k) { b.setAttribute('aria-pressed', k === i ? 'true' : 'false'); });
    pinyinEl.textContent = v.pinyin;
    glyph.setAttribute('aria-label', v.char + '，' + v.pinyin + '，点一下换成英文');
    hint.textContent = DEFAULT_HINT;
    start();
  }
  window.glyphSeek = function (ms) { stop(); timing(); draw(ms); };
  window.glyphSelect = function (i) { select(i); };
  glyph.addEventListener('click', function () {
    var v = V[cur];
    english = !english;
    if (english) {
      stop();
      svgs.forEach(function (el) { show(el, false); });
      enText.textContent = v.english;
      enText.className = 'en-text' + (v.english.length > 12 ? ' long' : (v.english.length > 6 ? ' mid' : ''));
      enText.style.color = v.color;
      show(enText, true);
      pinyinEl.textContent = '';
      setLabel('');
      glyph.setAttribute('aria-label', v.english + '，点一下变回汉字');
      hint.textContent = '再点一下，变回汉字。';
    } else {
      show(enText, false);
      show(svgs[cur], true);
      pinyinEl.textContent = v.pinyin;
      glyph.setAttribute('aria-label', v.char + '，' + v.pinyin + '，点一下换成英文');
      hint.textContent = DEFAULT_HINT;
      start();
    }
  });
  swatches.forEach(function (b, k) { b.addEventListener('click', function () { select(k); }); });
  back.addEventListener('click', function (e) {
    try { if (document.referrer && window.history.length > 1) { e.preventDefault(); window.history.back(); } } catch (err) {}
  });
  select(START_INDEX);
})();
</script>
